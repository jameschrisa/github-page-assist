    :root {
      --canvas: #ffffff; --fg: #1f2328; --fg-muted: #59636e;

    body {

    }
    main { padding: 32px; }
    svg { width: 72px; height: 72px; margin-bottom: 16px; }
    h1 { font-size: 48px; margin: 0 0 8px; letter-spacing: -0.02em; }
    p { color: var(--fg-muted); font-size: 15px; margin: 0 0 24px; }
    a {
      display: inline-block; padding: 8px 20px; border-radius: 6px;
      border: 1px solid var(--border); color: var(--accent);
      text-decoration: none; font-weight: 600; font-size: 14px;
    }
    a:hover { border-color: var(--accent); }
  </style>
</head>
