<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PagePilot — GitHub Pages Deployer</title>
  <meta name="description" content="Drop a folder, get a live GitHub Pages site. PagePilot configures the repo, Pages settings, and site metadata for you.">
  <link rel="canonical" href="https://jameschrisa.github.io/github-page-assist/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="PagePilot — GitHub Pages Deployer">
  <meta property="og:description" content="Drop a folder, get a live GitHub Pages site. PagePilot configures the repo, Pages settings, and site metadata for you.">
  <meta property="og:url" content="https://jameschrisa.github.io/github-page-assist/">
  <meta property="og:image" content="https://jameschrisa.github.io/github-page-assist/icons/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="icons/favicon.svg" alt="" width="20" height="20">
        <h1>PagePilot</h1>
      </div>
      <div id="account-chip" class="account-chip"></div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <!-- Single polite announcer for deploy progress (build notes §Build notes for engineering). -->
  <div id="announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <div class="toasts">
    <div id="toasts" role="status" aria-live="polite"></div>
    <div id="toasts-alert" role="alert"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
