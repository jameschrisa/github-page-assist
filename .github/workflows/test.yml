name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax-check modules
        run: |
          set -e
          for f in js/*.js sw.js tools/make-icons.mjs; do
            node --input-type=module --check < "$f"
          done
      - name: Run tests
        run: npm test
